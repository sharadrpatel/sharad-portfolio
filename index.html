<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>

    />
    <meta name="author" content="Sanandan Ojha" />
    <meta name="theme-color" content="#171718" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply a saved theme before first paint (the default is dark), and decide
      // whether the opening sequence plays: once per session, never under reduced motion.
      (function () {
        try {
          var t = localStorage.getItem("so-theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
          if (!sessionStorage.getItem("so-intro") && !matchMedia("(prefers-reduced-motion: reduce)").matches)
            document.documentElement.classList.add("intro");
        } catch (e) {}
      })();
    </script>

    <!-- Link previews. scripts/prerender.mjs rewrites the title and description
         for each project page at build time. -->
